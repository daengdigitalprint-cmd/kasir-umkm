<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MaccaPOS — Video Demo 9:16</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Panggung 1080×1920. Semua DOM adegan diisi js/scene.js. -->
<div id="stage" style="--bg:#efe9fb">
  <!-- Latar berlapis (di luar kamera; gerak parallax diatur dari timeline) -->
  <div id="bgBase"></div>
  <div id="blobA"></div>
  <div id="blobB"></div>
  <div id="grid"></div>
  <div id="grain"></div>
  <div id="sweep"></div>

  <!-- SATU rig kamera untuk seluruh dunia (Hukum #1) -->
  <div id="cam"><div id="world">
    <section class="act" id="act1"></section>
    <section class="act" id="act2"></section>
    <section class="act" id="act3"></section>
    <section class="act" id="act4"></section>
    <section class="act" id="act5"></section>
    <section class="act" id="act6"></section>
    <section class="act" id="act7"></section>
    <section class="act" id="act8"></section>
    <section class="act" id="act9"></section>
    <section class="act outro" id="act10"></section>
  </div></div>

  <!-- Bidang warna penyapu (transisi push) -->
  <div id="field"></div>
  <div id="vignette"></div>
</div>

<!-- Panel scrub — hanya dengan ?debug=1 -->
<div id="debug">
  <div><span id="dbgT">0.00</span>s / 40s — <span id="dbgAct">1</span></div>
  <input type="range" id="dbgRange" min="0" max="40" step="0.01" value="0">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="js/ui.js"></script>
<script src="js/cam.js"></script>
<script src="js/scene.js"></script>
</body>
</html>
