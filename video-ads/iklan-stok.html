<!doctype html>
<html lang="id">
<!-- Made with the Bang Motion skill by Bang Tutorial (https://youtube.com/bangtutorial) - MIT -->
<head>
<meta charset="utf-8">
<title>UMKM Kasir — Iklan Meta "Stok tinggal berapa?" (9:16, 15 dtk)</title>
<!--
  Konsep: tanya → jawab diegetik. Pertanyaan ditulis kapur di karung semen; kamera mundur, karung
  ternyata ikon produk di kasir; angka stok menjawab. Penutup: kata "tahu" digantikan logo.
  Palet: oranye #F09018 (maskot), violet #533AFD (brand), lime #A0EA71 (CTA landing), tinta #0D1738,
  kraft #8E8068 (turunan: warna karung semen). Font: Bricolage Grotesque, DM Sans, Kalam (kapur).
  Autoplay+loop; ?debug=1 scrub; ?clean=1 untuk export.
-->
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@500;700&family=Kalam:wght@700&display=swap" rel="stylesheet">
<style>
:root{--vio:#533AFD;--vio2:#3B25C9;--org:#F09018;--lime:#A0EA71;--ink:#0D1738}
html,body{margin:0;height:100%;background:#0b0d1a;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;overflow:hidden;font-family:"DM Sans",system-ui,sans-serif;color:var(--ink)}
.f{position:absolute;inset:0}
#bgO{background:radial-gradient(900px 800px at 25% 20%,#ffc163,transparent 70%),radial-gradient(1000px 900px at 85% 90%,#d9700a,transparent 70%),var(--org)}
#bgV,#bgV2{background:radial-gradient(900px 900px at 80% 25%,rgba(160,234,113,.22),transparent 65%),radial-gradient(1000px 1000px at 10% 95%,rgba(240,144,24,.22),transparent 70%),linear-gradient(165deg,#6a52ff,var(--vio) 45%,var(--vio2));clip-path:circle(0px at 540px 1010px)}
#bgO2{background:radial-gradient(900px 800px at 70% 15%,#ffc163,transparent 70%),radial-gradient(1000px 900px at 15% 90%,#d9700a,transparent 70%),var(--org);clip-path:circle(0px at 810px 1011px)}
.ghost{position:absolute;white-space:nowrap;font:800 300px/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.04em;color:transparent;pointer-events:none}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.12;mix-blend-mode:multiply;z-index:60;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
/* karung semen */
#sack{position:absolute;left:-90px;top:120px;width:1260px;height:1780px;border-radius:120px 120px 90px 90px;z-index:10;
  background:radial-gradient(700px 500px at 35% 30%,rgba(255,255,255,.18),transparent 70%),repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 3px,transparent 3px 11px),linear-gradient(180deg,#9b8d74,#857760);
  box-shadow:inset 0 30px 60px rgba(255,255,255,.12),inset 0 -60px 80px rgba(0,0,0,.25)}
#sack .seam{position:absolute;left:0;right:0;top:70px;height:26px;background:repeating-linear-gradient(90deg,#5d533f 0 26px,transparent 26px 44px)}
#sack .band{position:absolute;left:0;right:0;top:1170px;height:300px;background:#c9352f;display:grid;place-items:center;font:800 170px/1 "Bricolage Grotesque",sans-serif;letter-spacing:.02em;color:#f4ead6}
#sack .kg{position:absolute;right:120px;top:1500px;font:800 120px/1 "Bricolage Grotesque",sans-serif;color:rgba(30,24,14,.55)}
.chalk{position:absolute;left:150px;font:700 132px/1.05 "Kalam",cursive;color:#fbf8f0;filter:url(#chalkF);white-space:nowrap}
/* ponsel + kamera */
#cam{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;z-index:5}
.phone{position:absolute;left:220px;top:600px;width:640px;height:760px;border-radius:70px;background:#0f1424;padding:16px;box-sizing:border-box;box-shadow:0 60px 80px rgba(13,23,56,.35),inset 0 0 0 3px #2a3046;opacity:0}
.phone .screen{position:relative;width:100%;height:100%;border-radius:56px;overflow:hidden;background:#f8fafc}
.phone .screen img{position:absolute;left:0;top:-636px;width:100%}
.phone .fade{position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(transparent,#f8fafc)}
/* objek UI */
.o{position:absolute;opacity:0;will-change:transform,opacity;z-index:20}
#chip{left:250px;top:1110px;width:580px;height:180px;border-radius:90px;background:#fef3c6;border:5px solid #fbd977;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:24px;font:800 92px/1 "Bricolage Grotesque",sans-serif;color:#bb4d06;box-shadow:0 26px 40px rgba(13,23,56,.3)}
#chip b{display:inline-block;min-width:1.25em;text-align:center;font-size:120px;color:#9a3b00}
#warn{left:700px;top:1070px;padding:16px 30px;border-radius:40px;background:#D93A3F;color:#fff;font:700 50px/1 "DM Sans",sans-serif;box-shadow:0 12px 24px rgba(13,23,56,.3)}
#cart{left:190px;top:1330px;width:700px;height:150px;border-radius:75px;background:var(--lime);display:flex;align-items:center;justify-content:center;gap:22px;font:800 66px/1 "Bricolage Grotesque",sans-serif;color:var(--ink);box-shadow:0 22px 36px rgba(13,23,56,.3)}
.tap{position:absolute;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;border:7px solid #fff;background:rgba(255,255,255,.25);opacity:0;z-index:35;box-sizing:border-box}
.finger{position:absolute;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;background:rgba(13,23,56,.55);box-shadow:0 0 0 10px rgba(255,255,255,.6);opacity:0;z-index:36}
/* judul */
.hd{position:absolute;left:70px;top:225px;width:960px;opacity:0;font:800 112px/1.0 "Bricolage Grotesque",sans-serif;letter-spacing:-.03em;color:#fff;z-index:30}
.hd.ink{color:var(--ink)}
.hd.mid{top:700px;left:0;width:1080px;text-align:center;font-size:150px}
.hd .l{display:block;overflow:hidden;padding:.04em 0 .1em;margin-bottom:-.1em}
.hd .w{display:inline-block;will-change:transform,opacity}
#logo{position:absolute;width:240px;height:240px;margin:-120px 0 0 -120px;border-radius:50%;background:#fff;box-shadow:0 20px 40px rgba(13,23,56,.3);opacity:0;z-index:31;display:grid;place-items:center}
#logo img{width:205px}
#wm{position:absolute;left:0;right:0;top:820px;text-align:center;font:800 150px/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.035em;color:#fff;opacity:0;z-index:30}
#wm .l{display:block;overflow:hidden;padding:.04em 0 .12em}
#wm .w{display:inline-block}
#cta{position:absolute;left:190px;top:1040px;width:700px;height:170px;border-radius:85px;background:var(--lime);display:grid;place-items:center;font:800 92px/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.025em;color:var(--ink);box-shadow:0 26px 40px rgba(13,23,56,.35),inset 0 -8px 0 rgba(13,23,56,.12);opacity:0;z-index:30}
#url{position:absolute;left:0;right:0;top:1250px;text-align:center;font:700 64px/1 "DM Sans",sans-serif;color:#fff;opacity:0;z-index:30}
#dbg{position:fixed;left:0;right:0;bottom:0;display:none;gap:10px;align-items:center;padding:8px 12px;background:rgba(0,0,0,.7);color:#fff;font:13px monospace;z-index:99}
#dbg input{flex:1}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><filter id="chalkF" x="-5%" y="-20%" width="110%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="5"/><feComponentTransfer><feFuncA type="discrete" tableValues="0 .85 1 1"/></feComponentTransfer></filter></defs></svg>
<div id="stage">
  <div class="f" id="bgO"></div>
  <div class="f" id="bgV"></div>
  <div class="f" id="bgO2"></div>
  <div class="ghost" id="g1" style="top:1560px;-webkit-text-stroke:3px rgba(255,255,255,.14)">stok · stok · stok · stok · stok ·</div>

  <div id="cam">
    <div class="phone" id="phone"><div class="screen"><img src="assets/pos-1-semen.png" alt=""><div class="fade"></div></div></div>
  </div>

  <div id="sack">
    <div class="seam"></div>
    <div class="chalk" id="ch1" style="top:430px">Stok semen</div>
    <div class="chalk" id="ch2" style="top:580px">tinggal berapa?</div>
    <svg id="chU" style="position:absolute;left:150px;top:745px;overflow:visible" width="800" height="60" viewBox="0 0 800 60"><path d="M6 34 C 200 14, 480 52, 790 22" fill="none" stroke="#fbf8f0" stroke-width="12" stroke-linecap="round" filter="url(#chalkF)" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/></svg>
    <div class="band">SEMEN</div>
    <div class="kg">50 KG</div>
  </div>

  <div class="hd" id="h2"><span class="l">8 sak —</span><span class="l">langsung tahu</span></div>
  <div class="hd ink" id="h3"><span class="l">Jual, stok</span><span class="l">berkurang sendiri</span></div>
  <div class="hd ink mid" id="h4"><span class="l">Stok?</span><span class="l">Langsung <span class="w" id="kw">tahu</span></span></div>

  <div class="o" id="chip">Stok: <b id="num">50</b> sak</div>
  <div class="o" id="warn">menipis</div>
  <div class="o" id="cart"><svg width="62" height="62" viewBox="0 0 24 24" fill="none" stroke="#0D1738" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.6 12.2a1.6 1.6 0 0 0 1.6 1.3h8.6a1.6 1.6 0 0 0 1.6-1.2L21 8H6"/></svg>5 sak · 345.000</div>

  <div class="f" id="bgV2" style="z-index:29"></div>
  <div id="logo"><img src="assets/maskot.png" alt=""></div>
  <div id="wm"><span class="l">UMKM Kasir</span></div>
  <div id="cta">Coba gratis</div>
  <div id="url">kasirumkm.web.id</div>

  <div class="tap" id="tap"></div><div class="finger" id="fing"></div>
  <div class="grain" id="grain"></div>
</div>
<div id="dbg"><button id="dPlay">Play</button><input id="dScrub" type="range" min="0" max="1000" value="0"><span id="dClock">0.00s</span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const W=1080,H=1920,DUR=15;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);$('#stage').style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener('resize',fit);fit();
$$('.hd .l,#wm .l').forEach(l=>{[...l.childNodes].forEach(n=>{if(n.nodeType!==3)return;const ws=n.textContent.split(/(\s+)/);const frag=document.createDocumentFragment();
  ws.forEach(w=>{if(!w)return;if(/^\s+$/.test(w)){frag.appendChild(document.createTextNode(' '));return;}const s=document.createElement('span');s.className='w';s.textContent=w;frag.appendChild(s);});n.replaceWith(frag);});});

const tl=gsap.timeline({paused:true});const IR={immediateRender:false};
function hdIn(id,at,mode){const ws=$$(`#${id} .w`);tl.set('#'+id,{opacity:1},at);
  if(mode==='up')tl.fromTo(ws,{yPercent:115},{yPercent:0,duration:.6,ease:'power4.out',stagger:.07,...IR},at);
  if(mode==='down')tl.fromTo(ws,{yPercent:-115},{yPercent:0,duration:.6,ease:'power4.out',stagger:.07,...IR},at);
  if(mode==='depth')tl.fromTo(ws,{scale:2.4,opacity:0,filter:'blur(16px)'},{scale:1,opacity:1,filter:'blur(0px)',duration:.6,ease:'expo.out',stagger:.08,...IR},at);
  if(mode==='mask')tl.fromTo(`#${id} .l`,{clipPath:'inset(0% 100% 0% 0%)'},{clipPath:'inset(0% 0% 0% 0%)',duration:.6,ease:'power3.inOut',stagger:.14,...IR},at);}
function hdOut(id,at,ws){tl.to(ws||`#${id} .w`,{yPercent:-115,duration:.3,ease:'power3.in',stagger:.03},at);if(!ws)tl.set('#'+id,{opacity:0},at+.42);}
function tap(x,y,at){tl.set(['#tap','#fing'],{left:x,top:y},at-.2);
  tl.fromTo('#fing',{opacity:0,scale:1.5},{opacity:1,scale:1,duration:.15,ease:'power2.out',...IR},at-.2);
  tl.fromTo('#tap',{opacity:.95,scale:.3},{opacity:0,scale:1.4,duration:.4,ease:'power2.out',...IR},at);tl.to('#fing',{opacity:0,duration:.12},at+.22);}
const num=$('#num');function count(at,from,to,d,ease){const o={v:from};tl.fromTo(o,{v:from},{v:to,duration:d,ease,onUpdate(){num.textContent=Math.round(o.v);},...IR},at);}

/* ---------- 0–3  pembuka: pertanyaan ditulis kapur di karung ---------- */
tl.fromTo('#sack',{rotation:-4,scale:1.08,x:30},{rotation:-1.5,scale:1.0,x:0,duration:3,ease:'sine.out'},0);
tl.fromTo('#ch1',{clipPath:'inset(-20% 100% -20% 0%)'},{clipPath:'inset(-20% 0% -20% 0%)',duration:.85,ease:'none'},.1);
tl.fromTo('#ch2',{clipPath:'inset(-20% 100% -20% 0%)'},{clipPath:'inset(-20% 0% -20% 0%)',duration:1.1,ease:'none'},.95);
tl.to('#chU path',{strokeDashoffset:0,duration:.4,ease:'power2.out'},2.1);

/* ---------- 3–7  kamera mundur: karung = ikon produk di kasir; angka menjawab ---------- */
// ikon Semen Tiga Roda di layar: (339,1011); tombol + (761,1011); pill stok (459,1049)
tl.to('#sack',{x:339-540,y:1011-1010,scale:.07,rotation:0,duration:.85,ease:'expo.inOut'},2.85);
tl.to('#bgV',{clipPath:'circle(1500px at 540px 1010px)',duration:.9,ease:'power3.inOut'},2.9);
tl.fromTo('#phone',{opacity:0,scale:1.25},{opacity:1,scale:1,duration:.8,ease:'expo.out',...IR},3.15);
tl.to('#sack',{opacity:0,duration:.15},3.75);
hdIn('h2',3.5,'up');
// kamera mendekat pelan ke kartu Semen Tiga Roda
tl.to('#cam',{x:540-540*1.22,y:1011-1011*1.22,scale:1.22,duration:1.2,ease:'power2.inOut'},4.0);
// pill stok di layar (402,~930 setelah dorong) melahirkan chip besar
tl.fromTo('#chip',{opacity:0,x:-80,y:-70,scale:.3},{opacity:1,x:0,y:0,scale:1,duration:.6,ease:'back.out(1.6)',...IR},4.75);
count(4.9,50,8,1.2,'power3.out');
tl.fromTo('#chip',{scale:1},{scale:1.08,duration:.15,yoyo:true,repeat:1,ease:'power2.out',...IR},6.1);
tl.fromTo('#warn',{opacity:0,scale:.3,rotation:-20},{opacity:1,scale:1,rotation:6,duration:.45,ease:'back.out(2.6)',...IR},6.2);

/* ---------- 7–11  jual: tiap ketukan, stok turun sendiri ---------- */
hdOut('h2',6.95);
tl.to('#bgO2',{clipPath:'circle(1900px at 810px 1011px)',duration:.8,ease:'power3.in'},7.45);
hdIn('h3',7.7,'mask');
[7.45,7.85,8.25,8.65,9.05].forEach((t,i)=>{tap(810,1011,t);tl.set(num,{textContent:String(7-i)},t+.05);
  tl.fromTo('#chip',{y:0},{y:10,duration:.08,yoyo:true,repeat:1,ease:'power2.out',...IR},t);});
tl.to('#warn',{rotation:-4,scale:1.12,duration:.2,yoyo:true,repeat:1},9.15);
tl.fromTo('#cart',{opacity:0,y:200},{opacity:1,y:0,duration:.6,ease:'expo.out',...IR},9.45);

/* ---------- 11–15  "tahu" digantikan logo ---------- */
hdOut('h3',10.9);
tl.to(['#cam'],{y:'+=1400',duration:.55,ease:'power3.in'},10.9);
tl.to(['#chip','#warn','#cart'],{y:'+=1300',duration:.55,ease:'power3.in',stagger:.04},10.95);
hdIn('h4',11.35,'depth');

function build2(){
  // posisi kata "tahu" di koordinat panggung (setelah font termuat)
  const st=$('#stage').getBoundingClientRect(),k=st.width/W,r=$('#kw').getBoundingClientRect();
  const cx=(r.left-st.left+r.width/2)/k,cy=(r.top-st.top+r.height/2)/k+6;
  tl.set('#logo',{left:cx,top:cy},0);
  tl.to('#kw',{scaleX:0,opacity:0,duration:.25,ease:'power3.in'},12.25);
  tl.fromTo('#logo',{opacity:0,scale:0,rotation:-90},{opacity:1,scale:.7,rotation:0,duration:.5,ease:'back.out(2.2)',...IR},12.4);
  tl.set('#bgV2',{clipPath:`circle(0px at ${cx}px ${cy}px)`},12.75);
  tl.to('#bgV2',{clipPath:`circle(2300px at ${cx}px ${cy}px)`,duration:.8,ease:'power3.inOut'},12.75);
  hdOut('h4',12.75,'#h4 .w:not(#kw)');tl.set('#h4',{opacity:0},13.2);
  tl.to('#logo',{left:540,top:600,scale:1.25,duration:.75,ease:'power3.inOut'},12.85);
  tl.set('#wm',{opacity:1},13.3);
  tl.fromTo('#wm .w',{yPercent:-115},{yPercent:0,duration:.55,ease:'power4.out',stagger:.07,...IR},13.3);
  tl.fromTo('#cta',{opacity:0,scale:.5},{opacity:1,scale:1,duration:.5,ease:'back.out(2.2)',...IR},13.6);
  tl.fromTo('#url',{opacity:0,y:30},{opacity:1,y:0,duration:.45,ease:'power3.out',...IR},13.9);
  tl.fromTo('#logo',{rotation:0},{rotation:-6,duration:.3,yoyo:true,repeat:1,ease:'sine.inOut',...IR},14.2);
  tl.to({},{duration:.01},DUR-.01);
}
/* gerak latar */
tl.fromTo('#g1',{x:-100},{x:-1000,duration:DUR,ease:'none'},0);

const grain=$('#grain');
function life(){const f=Math.floor(tl.time()*12);grain.style.backgroundPosition=`${(f*137)%300}px ${(f*89)%300}px`;}
gsap.ticker.add(life);
const q=new URLSearchParams(location.search);
function start(){tl.play(0);}
tl.eventCallback('onComplete',()=>start());
window.OPENER={W,H,DURATION:DUR,tl,ready:false,seek(t){tl.pause(t,false);life();}};
addEventListener('keydown',e=>{if(/^[rR]$/.test(e.key))start();if(e.code==='Space'){e.preventDefault();tl.paused()?tl.play():tl.pause();}});
if(q.has('debug')){const dbg=$('#dbg');dbg.style.display='flex';const sc=$('#dScrub'),ck=$('#dClock');let drag=false;
  gsap.ticker.add(()=>{if(!drag)sc.value=String(tl.time()/DUR*1000);ck.textContent=tl.time().toFixed(2)+'s';$('#dPlay').textContent=tl.paused()?'Play':'Pause';});
  sc.addEventListener('pointerdown',()=>{drag=true;tl.pause();});addEventListener('pointerup',()=>drag=false);
  sc.addEventListener('input',()=>{tl.pause();tl.time(sc.value/1000*DUR);life();});$('#dPlay').onclick=()=>tl.paused()?tl.play():tl.pause();}
Promise.all([document.fonts.ready,...$$('img').map(im=>im.complete?1:new Promise(r=>{im.onload=im.onerror=r;}))]).then(()=>{
  gsap.set('#h4',{opacity:1});build2();gsap.set('#h4',{opacity:0});tl.pause(0);life();window.OPENER.ready=true;if(q.has('clean'))return;start();});
</script>
</body>
</html>
