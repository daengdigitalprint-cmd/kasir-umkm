  Sorotan kata: label struk bergerigi (bentuk struk di logo MaccaPOS) yang "tercetak" dari atas ke bawah
  Bahasa latar: ungu malam bersorot · krem · hijau · ungu brand, berganti tiap cut
  Tanda tangan: koin terbang masuk/keluar objek
  Gerak latar : sorot cahaya bergeser + butiran + push pelan tiap panggung
  Momen istimewa: sekat jatuh, koin emas dan oranye memisah

<body>
<div id="stage"><div id="chip"><span><i>Kas</i><b id="chipN">Rp0</b></span></div><div id="vig"></div><div id="grain"></div></div>
<audio id="vo" src="vo.wav" preload="auto"></audio>
<div id="ui"><button id="btn-play">Pause</button><button id="btn-restart">Restart</button><input id="scrub" type="range" min="0" max="1000" value="0"><span id="clock">0.00s</span></div>

<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const Q=new URLSearchParams(location.search), W=1080, H=1920;
let _s=20261115; const rnd=()=>{_s|=0;_s=_s+0x6D2B79F5|0;let t=Math.imul(_s^_s>>>15,1|_s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const fmt=v=>'Rp'+Math.round(v).toLocaleString('id-ID');
const el=(cls,html='',tag='div')=>{const e=document.createElement(tag);e.className=cls;e.innerHTML=html;return e;};
const tl=gsap.timeline({paused:true}), stageEl=$('#stage'), chip=$('#chip');

/* ---------- batas panggung (dtk) — disetel ulang saat VO masuk ---------- */
/* disinkronkan ke vo.wav (jeda terdeteksi: 1.90 3.56 6.39 8.44 11.34 12.47 15.25 17.09 19.04 21.83 24.93 26.51 29.61) */
const C=[0,2.1,4.25,8.85,10.5,11.45,12.65,13.75,15.8,19.7,22.15,25.35,26.95,28.5,30.6];
const DURATION=C[C.length-1];
const SPOTS=[], BOBS=[];

/* ---------- panggung: cut + geser 96 px, lalu push pelan sampai cut berikutnya ---------- */
function stage(i,bg){const t0=C[i],t1=C[i+1],st=el('st '+bg),spot=el('spot'),inn=el('in');st.append(spot,inn);stageEl.insertBefore(st,chip);
  SPOTS.push({spot,ph:i*1.3});
  tl.set(st,{autoAlpha:1},t0); if(i<C.length-2)tl.set(st,{autoAlpha:0},t1);
  const dir=i%2?1:-1;
  tl.fromTo(inn,{x:dir*96,scale:1.1},{x:0,scale:1,duration:.5,ease:'power3.out',immediateRender:false},t0);
  tl.fromTo(inn,{scale:1},{scale:1.06,duration:t1-t0-.5,ease:'none',immediateRender:false},t0+.5);
  return {st,inn,t0,t1};}
/* ---------- teks: baris kecil per kata + label struk yang tercetak ---------- */
function cap(S,at,small,key,{kwAt=.28,out=null}={}){const c=el('cap'),sm=el('sm'),kwW=el('kwW',`<span class="kw">${key}</span>`);
  small.split(' ').forEach((p,i,a)=>{const w=el('w',p,'span');sm.append(w);if(i<a.length-1)sm.append(' ');});
  c.append(sm,el('',''),kwW);S.st.append(c);
  const ws=$$('.w',sm); gsap.set(ws,{opacity:0}); gsap.set(kwW,{opacity:0});
  tl.fromTo(ws,{opacity:0,y:46,filter:'blur(12px)'},{opacity:1,y:0,filter:'blur(0px)',duration:.5,ease:'power4.out',stagger:.07,immediateRender:false},at);
  tl.set(kwW,{opacity:1},at+kwAt);
  tl.fromTo(kwW,{clipPath:'inset(0% 0% 100% 0%)',y:-40},{clipPath:'inset(0% 0% -20% 0%)',y:0,duration:.42,ease:'power3.out',immediateRender:false},at+kwAt);
  tl.fromTo(kwW,{scale:1},{scale:1.07,duration:.12,ease:'power2.out',yoyo:true,repeat:1,immediateRender:false},at+kwAt+.42);
  if(out!=null){tl.to(ws,{opacity:0,y:-40,duration:.25,ease:'power2.in'},out);tl.to(kwW,{opacity:0,y:-50,duration:.25,ease:'power2.in'},out+.03);}
  return c;}
/* ---------- laci & koin ---------- */
function drawer(par,cx,cy){const g=el('dr','<div class="dB"></div><div class="dC a"></div><div class="dV"></div><div class="dF"><div class="dl l">Usaha</div><div class="dl r">Pribadi</div><div class="dH"></div></div>');
  g.style.left=cx+'px';g.style.top=cy+'px';par.append(g);return {g,c:$('.dC',g),v:$('.dV',g),f:$('.dF',g)};}
const coin=(par,cls='')=>{const c=el('coin '+cls,'Rp');par.append(c);return c;};
const spot=(r,c,j=1)=>({x:-286+c*52+(r%2)*26+(rnd()-.5)*10*j,y:-78-r*34+(rnd()-.5)*6*j});
const spots=(rows,j=1)=>{const a=[];for(let r=0;r<rows;r++)for(let c=0;c<11+(r%2?0:1);c++)a.push(spot(r,c,j));return a;};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function rain(par,list,t0,gap,{cls=()=>'',fromX=p=>p.x+(rnd()-.5)*240,fromY=-1500,dur=.55}={}){return list.map((p,i)=>{const c=coin(par,cls(i)),t=t0+i*gap;
  tl.set(c,{opacity:1,x:fromX(p,i),y:fromY,rotation:(rnd()-.5)*200,scale:1},t);
  tl.to(c,{x:p.x,duration:dur,ease:'sine.out'},t); tl.to(c,{y:p.y,rotation:(rnd()-.5)*30,duration:dur,ease:'power2.in'},t);
  tl.fromTo(c,{scaleY:.7},{scaleY:1,duration:.3,ease:'back.out(3)',immediateRender:false},t+dur); return c;});}
const still=(par,list,cls=()=>'')=>list.map((p,i)=>{const c=coin(par,cls(i));gsap.set(c,{opacity:1,x:p.x,y:p.y,rotation:(rnd()-.5)*30});return c;});
const pop=(e,at,{dur=.5,from=.3,rot=0,ease='back.out(1.9)'}={})=>tl.fromTo(e,{opacity:0,scale:from,rotation:rot},{opacity:1,scale:1,rotation:0,duration:dur,ease,immediateRender:false},at);

/* ---------- angka kas: fungsi murni dari waktu ---------- */
const KQ=i=>Math.min(1,(C[i+1]-C[i])/1.3);            // panggung pendek: animasi dipercepat
const LEAK=[[C[4]+.72*KQ(4),100000],[C[5]+.72*KQ(5),250000],[C[6]+.72*KQ(6),300000],[C[7]+.72*KQ(7),1000000]];
function kas(t){let v=2e6;for(const [a,amt] of LEAK){const q=clamp((t-a)/.4);v-=q>=1?amt:Math.round(amt*q/5000)*5000;}return v;}

/* ================= PANGGUNG ================= */
/* 0 — hujan koin ke laci: jualan LAKU BANYAK */
{const S=stage(0,'dark'),D=drawer(S.inn,540,1180);
  rain(D.c,shuffle(spots(3)).slice(0,30),.05,.068);
  cap(S,.15,'jualan','laku banyak');}
/* 1 — koin melesat pergi: tapi uangnya KE MANA? */
{const S=stage(1,'cream'),D=drawer(S.inn,540,1220),cs=still(D.c,spots(3,1).slice(0,30));
  cs.forEach((c,i)=>{if(i<2)return;const t=S.t0+.1+i*.022,a=-Math.PI/2+(rnd()-.5)*2.2;
    tl.to(c,{x:'+='+Math.cos(a)*1500,y:'+='+Math.sin(a)*1700,rotation:'+=400',duration:.6,ease:'power2.in'},t);});
  [[230,700,-14],[470,570,6],[690,720,16]].forEach(([x,y,r],i)=>{const q=el('q','?');q.style.left=x+'px';q.style.top=y+'px';S.inn.append(q);
    pop(q,S.t0+.75+i*.16,{rot:r*3,dur:.55});BOBS.push({e:q,a:16,f:2.2,ph:i*1.9,r});});
  cap(S,S.t0+.12,'tapi uangnya','ke mana?');}
/* 2 — struk tercetak: omzet hari ini 2 JUTA */
let totEl,totT;
{const S=stage(2,'green');const pw=el('paperW'),p=el('paper','<h4>Penjualan hari ini</h4><div class="prow"><span>Es teh ×40</span><span>200.000</span></div><div class="prow"><span>Nasi goreng ×60</span><span>900.000</span></div><div class="prow"><span>Mie ayam ×75</span><span>900.000</span></div><div class="ptot"><small>Total omzet</small><b>Rp0</b></div>');
  pw.append(p);S.inn.append(pw,el('slot'));
  tl.fromTo(pw,{height:0},{height:800,duration:1.15,ease:'steps(12)',immediateRender:false},S.t0+.15);
  tl.fromTo($$('.prow',p),{opacity:0,x:-30},{opacity:1,x:0,duration:.3,ease:'power3.out',stagger:.2,immediateRender:false},S.t0+.9);
  tl.fromTo($('.ptot',p),{opacity:0,y:20},{opacity:1,y:0,duration:.35,ease:'back.out(2)',immediateRender:false},S.t0+1.5);
  tl.fromTo($('.ptot b',p),{scale:1},{scale:1.14,duration:.14,ease:'power2.out',yoyo:true,repeat:1,immediateRender:false},S.t0+2.4);
  totEl=$('.ptot b',p);totT=S.t0+1.55;
  cap(S,S.t0+.12,'omzet hari ini','2 juta',{kwAt:1.6});}
/* 3 — koin keluar dari laci: tapi laci kasir DIPAKAI JUGA */
{const S=stage(3,'dark'),D=drawer(S.inn,540,1180),cs=still(D.c,spots(3,1).slice(0,30));
  cs.slice(8).reverse().forEach((c,i)=>{const t=S.t0+.35+i*.05,sx=(i%2?1:-1)*(500+rnd()*500);
    tl.to(c,{y:'-=320',duration:.3,ease:'power2.out'},t);tl.to(c,{y:'+=1500',duration:.6,ease:'power2.in'},t+.3);
    tl.to(c,{x:'+='+sx,rotation:'+='+(sx>0?360:-360),duration:.9,ease:'none'},t);});
  cap(S,S.t0+.12,'tapi laci kasir','dipakai juga');
  tl.fromTo(chip,{opacity:0,y:80},{opacity:1,y:0,duration:.45,ease:'back.out(1.8)',immediateRender:false},S.t0+.5);}
/* 4–7 — pengeluaran pribadi, satu objek per ketukan */
const ICON={

/* ============ PEREKAT ============ */
const fit=()=>{const s=Math.min(innerWidth/W,innerHeight/H);stageEl.style.transform=`translate(-50%,-50%) scale(${s})`;};
addEventListener('resize',fit);fit();
const clock=$('#clock'),scrub=$('#scrub'),btn=$('#btn-play');let scrubbing=false;
gsap.ticker.add(()=>{const t=tl.time();tick(t);clock.textContent=t.toFixed(2)+'s';if(!scrubbing)scrub.value=String(t/DURATION*1000);});
const vo=$('#vo');
const voSync=()=>{if(Math.abs(vo.currentTime-tl.time())>.12)vo.currentTime=Math.min(tl.time(),vo.duration||1e9);};
const go=(from)=>{if(from!=null)tl.time(from);voSync();const pr=tl.time()<(vo.duration||0)?vo.play():null;tl.play();btn.textContent='Pause';return pr;};
const halt=()=>{tl.pause();vo.pause();btn.textContent='Play';};
const toggle=()=>{tl.paused()?go():halt();};
btn.onclick=toggle;$('#btn-restart').onclick=()=>go(0);
scrub.addEventListener('pointerdown',()=>{scrubbing=true;halt();});
addEventListener('pointerup',()=>scrubbing=false);
scrub.addEventListener('input',()=>{tl.pause();tl.time(scrub.value/1000*DURATION);});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();toggle();}if(/^[rR]$/.test(e.key))go(0);});
if(Q.has('debug'))$('#ui').classList.add('on');
tl.eventCallback('onComplete',()=>{go(0);});
const seek=t=>{tl.pause();tl.time(t,false);tick(t);};
window.OPENER={W,H,tl,DURATION,seek,ready:false};
Promise.all([document.fonts.ready,...$$('img').map(i=>i.decode().catch(()=>{}))]).then(()=>{
  $$('.kw').forEach(k=>{const w=k.offsetWidth;if(w>860)k.style.fontSize=Math.floor(112*860/w)+'px';});   // label terlalu lebar: kecilkan
