<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const Q=new URLSearchParams(location.search), W=1080, H=1920;
let _s=20261115; const rnd=()=>{_s|=0;_s=_s+0x6D2B79F5|0;let t=Math.imul(_s^_s>>>15,1|_s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};

/* ---------- teks: baris kecil per kata + label struk yang tercetak ---------- */
function cap(S,at,small,key,{kwAt=.28,out=null}={}){const c=el('cap'),sm=el('sm'),kwW=el('kwW',`<span class="kw">${key}</span>`);

  tl.fromTo(ws,{opacity:0,y:46,filter:'blur(12px)'},{opacity:1,y:0,filter:'blur(0px)',duration:.5,ease:'power4.out',stagger:.07,immediateRender:false},at);
  tl.set(kwW,{opacity:1},at+kwAt);
  tl.fromTo(kwW,{clipPath:'inset(0% 0% 100% 0%)',y:-40},{clipPath:'inset(0% 0% -20% 0%)',y:0,duration:.42,ease:'power3.out',immediateRender:false},at+kwAt);
  tl.fromTo(kwW,{scale:1},{scale:1.07,duration:.12,ease:'power2.out',yoyo:true,repeat:1,immediateRender:false},at+kwAt+.42);
  if(out!=null){tl.to(ws,{opacity:0,y:-40,duration:.25,ease:'power2.in'},out);tl.to(kwW,{opacity:0,y:-50,duration:.25,ease:'power2.in'},out+.03);}
  return c;}
/* ---------- laci & koin ---------- */
function drawer(par,cx,cy){const g=el('dr','<div class="dB"></div><div class="dC a"></div><div class="dV"></div><div class="dF"><div class="dl l">Usaha</div><div class="dl r">Pribadi</div><div class="dH"></div></div>');

const coin=(par,cls='')=>{const c=el('coin '+cls,'Rp');par.append(c);return c;};

function rain(par,list,t0,gap,{cls=()=>'',fromX=p=>p.x+(rnd()-.5)*240,fromY=-1500,dur=.55}={}){return list.map((p,i)=>{const c=coin(par,cls(i)),t=t0+i*gap;
  tl.set(c,{opacity:1,x:fromX(p,i),y:fromY,rotation:(rnd()-.5)*200,scale:1},t);
  tl.to(c,{x:p.x,duration:dur,ease:'sine.out'},t); tl.to(c,{y:p.y,rotation:(rnd()-.5)*30,duration:dur,ease:'power2.in'},t);
  tl.fromTo(c,{scaleY:.7},{scaleY:1,duration:.3,ease:'back.out(3)',immediateRender:false},t+dur); return c;});}
const still=(par,list,cls=()=>'')=>list.map((p,i)=>{const c=coin(par,cls(i));gsap.set(c,{opacity:1,x:p.x,y:p.y,rotation:(rnd()-.5)*30});return c;});
const pop=(e,at,{dur=.5,from=.3,rot=0,ease='back.out(1.9)'}={})=>tl.fromTo(e,{opacity:0,scale:from,rotation:rot},{opacity:1,scale:1,rotation:0,duration:dur,ease,immediateRender:false},at);

/* ---------- batas panggung (dtk) — disinkronkan ke vo.wav (56,92 dtk) lewat whisper per kata ---------- */

const CUP=`<svg viewBox="-20 -150 460 780"><defs><clipPath id="cupc"><path d="M14 14H406L366 606H54Z"/></clipPath><linearGradient id="teag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2A04A"/><stop offset="1" stop-color="#A9480C"/></linearGradient></defs>

<path d="M14 14H406L366 606H54Z" fill="none" stroke="#3B1F12" stroke-width="13" stroke-linejoin="round"/></svg>`;
let _cupN=0;
function cup(par,x,y,w=420){const k=++_cupN,c=el('hcup',CUP.replace(/cupc/g,'cupc'+k).replace(/teag/g,'teag'+k));c.style.cssText=`left:${x}px;top:${y}px;width:${w}px`;par.append(c);gsap.set($$('.tea',c),{transformOrigin:'50% 100%'});return c;}
const ice=(par,x,y,s=96)=>{const i=el('hice');i.style.cssText=`left:${x}px;top:${y}px;width:${s}px;height:${s}px`;par.append(i);return i;};

/* ---------- panggung: cut + geser 96 px, lalu push pelan sampai cut berikutnya ---------- */
function stage(i,bg){const t0=C[i],t1=C[i+1],st=el('st '+bg),spot=el('spot'),inn=el('in');st.append(spot,inn);stageEl.insertBefore(st,chip);
  SPOTS.push({spot,ph:i*1.3});

  tl.fromTo(inn,{x:dir*96,scale:1.1},{x:0,scale:1,duration:.5,ease:'power3.out',immediateRender:false},t0);

  return {st,inn,t0,t1};}

/* ================= PANGGUNG ================= */
/* 0 — HOOK (0–3 dtk): gelas terisi teh, es berjatuhan tiap 0,12 dtk, label harga & modal masuk,
   angka untung berputar naik ke 3.000 lalu stempel BELUM TENTU menghantam dan angkanya dicoret. */
{const S=stage(0,'dark'),t=S.t0,c=cup(S.inn,300,700,480);gsap.set(c,{opacity:0});

  const md=tag(S.inn,'<small>modal</small><b>Rp2.000</b>','md');gsap.set(md,{opacity:0});

/* 1 — yang dihitung cuma teh & gula */
{const S=stage(1,'cream'),t=S.t0;

{const S=stage(2,'orange'),t=S.t0,c=cup(S.inn,370,640,340);gsap.set(c,{opacity:0});pop(c,t+.02,{from:.6,dur:.3});

/* ---------- semua yang bergerak terus: fungsi waktu ---------- */
function tick(t){
  NUMS.forEach(o=>{o.e.textContent=o.fm(o.f(t));});
  SPOTS.forEach(o=>{o.spot.style.transform=`translate(${Math.sin(t*.7+o.ph)*150}px,${Math.cos(t*.55+o.ph)*190}px)`;});
  BOBS.forEach(o=>{o.e.style.marginTop=(Math.sin(t*o.f+o.ph)*o.a)+'px';});
  RISE.forEach(o=>{if(t<C[9])return;const y=2100-((o.y0+(t-C[9])*o.v)%2300);o.c.style.opacity=.85;o.c.style.transform=`translate(${o.x+Math.sin(t*1.3+o.ph)*40}px,${y}px) rotate(${t*60+o.ph*57}deg)`;});
}

/* ============ PEREKAT ============ */
const fit=()=>{const s=Math.min(innerWidth/W,innerHeight/H);stageEl.style.transform=`translate(-50%,-50%) scale(${s})`;};
addEventListener('resize',fit);fit();
const clock=$('#clock'),scrub=$('#scrub'),btn=$('#btn-play');let scrubbing=false;
gsap.ticker.add(()=>{const t=tl.time();tick(t);clock.textContent=t.toFixed(2)+'s';if(!scrubbing)scrub.value=String(t/DURATION*1000);});
const vo=$('#vo');
const voSync=()=>{if(Math.abs(vo.currentTime-tl.time())>.12)vo.currentTime=Math.min(tl.time(),vo.duration||1e9);};
const go=(from)=>{if(from!=null)tl.time(from);voSync();const pr=tl.time()<(vo.duration||0)?vo.play():null;tl.play();btn.textContent='Pause';return pr;};
const halt=()=>{tl.pause();vo.pause();btn.textContent='Play';};
const toggle=()=>{tl.paused()?go():halt();};
btn.onclick=toggle;$('#btn-restart').onclick=()=>go(0);
scrub.addEventListener('pointerdown',()=>{scrubbing=true;halt();});
addEventListener('pointerup',()=>scrubbing=false);
scrub.addEventListener('input',()=>{tl.pause();tl.time(scrub.value/1000*DURATION);});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();toggle();}if(/^[rR]$/.test(e.key))go(0);});
if(Q.has('debug'))$('#ui').classList.add('on');
tl.eventCallback('onComplete',()=>{go(0);});
const seek=t=>{tl.pause();tl.time(t,false);tick(t);};
window.OPENER={W,H,tl,DURATION,seek,ready:false};
Promise.all([document.fonts.ready,...$$('img').map(i=>i.decode().catch(()=>{}))]).then(()=>{
  $$('.kw').forEach(k=>{const w=k.offsetWidth;if(w>860)k.style.fontSize=Math.floor(112*860/w)+'px';});   // label terlalu lebar: kecilkan
  window.OPENER.ready=true;tick(0);if(Q.has('clean'))return;
  /* suara: coba putar langsung; bila diblokir browser, tahan di frame 0 dan mulai pada klik/tombol pertama */
  const pr=go(0);if(pr)pr.catch(()=>{halt();tl.time(0);const st=()=>{removeEventListener('pointerdown',st);removeEventListener('keydown',st);go(0);};addEventListener('pointerdown',st);addEventListener('keydown',st);});});
</script>
