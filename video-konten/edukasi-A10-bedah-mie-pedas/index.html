/* ---------- semua yang bergerak terus: fungsi waktu ---------- */
function tick(t){
  NUMS.forEach(o=>{o.e.textContent=o.fm(o.f(t));});
  SPOTS.forEach(o=>{o.spot.style.transform=`translate(${Math.sin(t*.7+o.ph)*150}px,${Math.cos(t*.55+o.ph)*190}px)`;});
  BOBS.forEach(o=>{o.e.style.marginTop=(Math.sin(t*o.f+o.ph)*o.a)+'px';});
}

/* ============ PEREKAT ============ */
const fit=()=>{const s=Math.min(innerWidth/W,innerHeight/H);stageEl.style.transform=`translate(-50%,-50%) scale(${s})`;};
addEventListener('resize',fit);fit();
const clock=$('#clock'),scrub=$('#scrub'),btn=$('#btn-play');let scrubbing=false;
gsap.ticker.add(()=>{const t=tl.time();tick(t);clock.textContent=t.toFixed(2)+'s';if(!scrubbing)scrub.value=String(t/DURATION*1000);});
const vo=$('#vo');
const voSync=()=>{if(Math.abs(vo.currentTime-tl.time())>.12)vo.currentTime=Math.min(tl.time(),vo.duration||1e9);};
const go=(from)=>{if(from!=null)tl.time(from);voSync();const pr=tl.time()<(vo.duration||0)?vo.play():null;tl.play();btn.textContent='Pause';return pr;};
const halt=()=>{tl.pause();vo.pause();btn.textContent='Play';};
const toggle=()=>{tl.paused()?go():halt();};
btn.onclick=toggle;$('#btn-restart').onclick=()=>go(0);
scrub.addEventListener('pointerdown',()=>{scrubbing=true;halt();});
addEventListener('pointerup',()=>scrubbing=false);
scrub.addEventListener('input',()=>{tl.pause();tl.time(scrub.value/1000*DURATION);});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();toggle();}if(/^[rR]$/.test(e.key))go(0);});
if(Q.has('debug'))$('#ui').classList.add('on');
tl.eventCallback('onComplete',()=>{go(0);});
const seek=t=>{tl.pause();tl.time(t,false);tick(t);};
window.OPENER={W,H,tl,DURATION,seek,ready:false};
Promise.all([document.fonts.ready,...$$('img').map(i=>i.decode().catch(()=>{}))]).then(()=>{
  $$('.kw').forEach(k=>{const w=k.offsetWidth;if(w>860)k.style.fontSize=Math.floor(112*860/w)+'px';});   // label terlalu lebar: kecilkan
  window.OPENER.ready=true;tick(0);if(Q.has('clean'))return;
  /* suara: coba putar langsung; bila diblokir browser, tahan di frame 0 dan mulai pada klik/tombol pertama */
  const pr=go(0);if(pr)pr.catch(()=>{halt();tl.time(0);const st=()=>{removeEventListener('pointerdown',st);removeEventListener('keydown',st);go(0);};addEventListener('pointerdown',st);addEventListener('keydown',st);});});
</script>
